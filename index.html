else if(gtab==='mod'){const m=modOf(),v=VEH[SAVE.veh];h+=`<b>${v.n}</b>`;[['e','Mesin','+5% kecepatan, +12% akselerasi'],['t','Ban','+10% grip'],['b','Rem','+12% pengereman']].forEach(([k,nm,ds])=>{const l=m[k],c=200*(l+1);h+=`<div class='it'><div><b>${nm}</b> ${'●'.repeat(l)+'○'.repeat(3-l)}<br><small>${ds}</small></div><button data-a='mod' data-k='${k}' ${l>=3||SAVE.coins<c||lvl()<[2,5,8][l]?'disabled':''}>${l>=3?'MAX':lvl()<[2,5,8][l]?'Butuh Lv '+[2,5,8][l]:'Upgrade '+c}</button></div>`});
h+=`<div class='it'><div><b>Cat</b><br>${PAINT.map(c=>`<span class='sw' data-a='paint' data-c='${c}' style='background:${c}'></span>`).join('')}</div></div><div class='it'><div><b>Spoiler</b></div><button data-a='spoil'>${SAVE.spoil[SAVE.veh]?'Lepas':'Pasang'}</button></div>`}
else if(gtab==='trk')TRACKS.forEach((t,i)=>{h+=`<div class='it'><div><b>${t.n}</b><br><small>${t.k==='Jalan'?'Balap jalan raya · lalu lintas padat':t.gp?'MotoGP · sirkuit profesional, lawan pembalap':'Balap sirkuit · lawan mobil balap'}</small></div><button data-a='trk' data-i='${i}' ${SAVE.track===i?'disabled':''}>${SAVE.track===i?'Dipilih':'Pilih'}</button></div>`});
if(gtab==='adm')h=admHtml();if(gtab==='wp')h=wpHtml();gbody.innerHTML=h;if(gtab==='mp'){mpEl.style.display='flex';gbody.appendChild(mpEl)}}
gbody.onclick=e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(a==='veh'){const i=+el.dataset.i;if(!SAVE.own.includes(i)){SAVE.coins-=VEH[i].p;SAVE.own.push(i)}SAVE.veh=i}
else if(a==='mod'){const m=modOf(),k=el.dataset.k,c=200*(m[k]+1);if(m[k]<3&&SAVE.coins>=c&&lvl()>=[2,5,8][m[k]]){SAVE.coins-=c;m[k]++}}
else if(a==='paint')SAVE.paint[SAVE.veh]=el.dataset.c;
else if(a==='spoil')SAVE.spoil[SAVE.veh]=SAVE.spoil[SAVE.veh]?0:1;
else if(a==='trk')SAVE.track=+el.dataset.i;
else if(a==='weq')SAVE.wp=+el.dataset.i;
else if(a==='wup'){const i=+el.dataset.i,L=SAVE.wu[i]||0,c=250*(L+1);if(L<3&&SAVE.coins>=c){SAVE.coins-=c;SAVE.wu[i]=L+1}}
else if(a==='wbuy'){const i=+el.dataset.i,w=WEAP[i];if(lvl()>=w.req&&SAVE.coins>=w.p){SAVE.coins-=w.p;SAVE.wo.push(i);SAVE.wp=i}}
save();renderGar()};
document.getElementById('gtabs').onclick=e=>{const b=e.target.closest('button');if(b){gtab=b.dataset.t;renderGar()}};
document.getElementById('gst').onclick=()=>{snd();applyVeh();if(loaded!==SAVE.track)loadTrack(SAVE.track);init();started=true;over=false;gmsg.textContent=''};
function earn(){const e=Math.floor(score/3)+lap*50,l0=lvl(),xg=Math.floor(score/4)+lap*30+kills*30;SAVE.coins+=e;SAVE.xp+=xg;if(lvl()>l0)SAVE.coins+=300*(lvl()-l0);save();gmsg.textContent='+'+e+' koin · +'+xg+' XP · '+kills+' hancur'+(lvl()>l0?' · NAIK LEVEL '+lvl()+'! +300 koin':'')+' · skor '+Math.floor(score)+' · Suka game ini? Tap ☕ Dukung';renderGar()}
const ADMH='5d69fca806bbaa51695a0c32c0368d0bfa1b5b58422318996f8de00570d31dff';
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function wpHtml(){return WEAP.map((w,i)=>{const own=SAVE.wo.includes(i),L=SAVE.wu[i]||0,c=250*(L+1),lk=lvl()<w.req;
return `<div class='it'><div><b>${w.n}</b> ${'●'.repeat(L)+'○'.repeat(3-L)}<br><small>${w.d} · Lv ${w.req}</small></div><div style='display:flex;gap:6px'>`+(own?`<button data-a='weq' data-i='${i}' ${SAVE.wp===i?'disabled':''}>${SAVE.wp===i?'Dipakai':'Pakai'}</button><button data-a='wup' data-i='${i}' ${L>=3||SAVE.coins<c?'disabled':''}>${L>=3?'MAX':'+'+c}</button>`:`<button data-a='wbuy' data-i='${i}' ${lk||SAVE.coins<w.p?'disabled':''}>${lk?'Butuh Lv '+w.req:'Beli '+w.p}</button>`)+`</div></div>`}).join('')}
function admHtml(){return SAVE.admin?`<div class='it'><div><b>Mode Admin aktif</b><br><small>Semua mobil, modif, dan lintasan terbuka</small></div></div><div class='it'><div>Tambah koin</div><button id='adc'>+100000</button></div><div class='it'><div>Reset semua data game</div><button id='adr'>Reset</button></div>`:`<div class='it'><input id='adi' type='password' placeholder='Kode admin' style='flex:1;min-width:0;padding:8px;border-radius:8px;border:0'><button id='adb'>Buka</button></div><small id='adm'></small>`}
gbody.addEventListener('click',async e=>{const id=e.target.id;
if(id==='adb'){const v=document.getElementById('adi').value.trim();if(await sha(v)===ADMH){SAVE.admin=1;SAVE.xp=Math.max(SAVE.xp,1e6);SAVE.wo=[0,1,2,3];SAVE.own=VEH.map((_,i)=>i);SAVE.coins=Math.max(SAVE.coins,999999);VEH.forEach((_,i)=>SAVE.mods[i]={e:3,t:3,b:3});save();renderGar()}else document.getElementById('adm').textContent='Kode salah'}
else if(id==='adc'){SAVE.coins+=100000;save();renderGar()}
else if(id==='adr'){try{localStorage.removeItem('bksave')}catch(_){}location.reload()}});
applyVeh();renderGar();
let lt=0;function loop(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;upd(dt);render3d(t);hud();pres(t);gar.style.display=(!started||over)?'flex':'none';requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
