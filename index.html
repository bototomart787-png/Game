const MYC=['#ff5a5a','#ffd84a','#5aff8a','#c77dff','#ff9f43','#2ee6d6'][Math.random()*6|0],NICK='P'+(10+Math.random()*90|0);
let RM=null,RC='',peers=[],lps=0;
async function joinRoom(code){code=(code||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6);if(code.length<3){rt.textContent='Kode min. 3 karakter';return}
try{const room=window.claude&&await claude.use('room');if(!room){rt.textContent='Multiplayer tidak tersedia di sini';return}
if(RM){try{await RM.leave()}catch(_){}}peers=[];
RM=await room.join('balap-'+code);RC=code;ci.value=code;
RM.onPeers(c=>{peers=c.peers.filter(p=>!p.isMe);rt.textContent='Ruang '+RC.toUpperCase()+' · '+(peers.length+1)+' pemain'});
try{location.hash=code}catch(_){}rt.textContent='Ruang '+RC.toUpperCase()+' · 1 pemain'}catch(e){rt.textContent='Gagal gabung, coba lagi'}}
document.getElementById('bj').onclick=()=>joinRoom(ci.value);
document.getElementById('bn').onclick=async()=>{if(!RM){const a='abcdefghjkmnpqrstuvwxyz23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.random()*a.length|0];await joinRoom(c)}
if(!RM)return;try{await navigator.clipboard.writeText(LINK+'#'+RC);rt.textContent='Link disalin! Kode: '+RC.toUpperCase()}catch(_){rt.textContent='Kirim kode: '+RC.toUpperCase()}};
if(location.hash.length>2)setTimeout(()=>joinRoom(location.hash.slice(1)),800);
function pres(t){if(!RM||t-lps<100)return;lps=t;RM.presence({p:pos,o:px,l:lap,c:paintC(),v:SAVE.veh,t:SAVE.track,n:NICK}).catch(()=>{})}
const hex=/^#[0-9a-f]{6}$/i;
function ghosts(){return peers.filter(p=>(p.presence||{}).t===SAVE.track).map(p=>{const q=p.presence||{};return{id:p.peer,z:Number.isFinite(q.p)?((q.p%TL)+TL)%TL:0,o:Number.isFinite(q.o)?Math.max(-2,Math.min(2,q.o)):0,c:hex.test(q.c)?q.c:'#ffffff',v:(q.v|0)%5,n:String(q.n||'').slice(0,10),l:+q.l||1}})}
const GM=new Map(),spn=document.getElementById('sp');
document.getElementById('gb').onclick=()=>{spn.style.display=spn.style.display==='block'?'none':'block'};
function saveLX(){try{localStorage.setItem('bklx',JSON.stringify(LX))}catch(e){}rs()}
spn.querySelectorAll('button[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,lim=k==='w'?[.2,.8]:[.02,.81];LX[k]=Math.max(lim[0],Math.min(lim[1],LX[k]+(+b.dataset.d)*.06));saveLX()});
document.getElementById('sw').onclick=()=>{LX={w:1-LX.w,g:.83-LX.b,b:.83-LX.g};saveLX()};
function ghost3d(){const seen=new Set();for(const q of ghosts()){let e=GM.get(q.id);if(!e){const car=mkCar(new THREE.Color(q.c),q.v),cn=document.createElement('canvas');cn.width=256;cn.height=64;const x=cn.getContext('2d');x.font='bold 40px system-ui';x.textAlign='center';x.fillStyle='#fff';x.strokeStyle='#000';x.lineWidth=6;x.strokeText(q.n,128,46);x.fillText(q.n,128,46);
const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cn),fog:false}));sp.scale.set(6,1.5,1);sp.position.y=3;car.add(sp);e={car};GM.set(q.id,e)}
e.car.visible=true;place(e.car,q.z,q.o);seen.add(q.id)}
for(const[id,e]of GM)if(!seen.has(id)){SC.remove(e.car);GM.delete(id)}}
// ---------- update ----------
function upd(dt){
if(!started||over){if(og)og.gain.value=0;return}
let wh=false,gp=0,bp=0;for(const r of P.values()){if(r.t==='w')wh=true;if(r.t==='g')gp=1;if(r.t==='b')bp=1}
if(K.ArrowUp||K.w)gp=1;if(K.ArrowDown||K.s||K[' '])bp=1;
G=ap(G,gp,dt*(gp?2.5:6));Br=ap(Br,bp,dt*(bp?5:6));
const sp=spd/MAX,dx=dt*2*sp;
const kb=((K.ArrowRight||K.d)?1:0)-((K.ArrowLeft||K.a)?1:0);
if(kb)st=ap(st,kb,dt*2.5);else if(!wh)st=ap(st,0,dt*(1+3*sp));
pos+=spd*dt;if(pos>=TL){pos-=TL;lap++;time+=TD.lap}
px+=st*dx*VG;px-=KV[Math.floor(pos/STEP)]*spd*spd*.028*dt/VG;
spd+=(MAX*.4*VA*G*(1-sp*.6)-MAX*.9*VB*Br-MAX*(.06+.1*sp*sp))*dt;
if(Math.abs(px)>1.15&&spd>MAX/4)spd-=MAX*.8*VO*dt;
px=Math.max(-2.4,Math.min(2.4,px));spd=Math.max(0,Math.min(MAX,spd));
gear=GR.findIndex(v=>sp<v);const lo=gear?GR[gear-1]:0;
rpm=Math.min(7000,900+Math.min(1,(sp-lo)/(GR[gear]-lo))*5000+G*700);
if(og){osc.frequency.value=rpm/60*1.5;og.gain.value=.03+.05*G}
for(const c of cars){c.z=(c.z+c.s*dt)%TL;let d=((c.z-pos)%TL+TL)%TL;if(d>TL/2)d-=TL;
if(Math.abs(d)<4.6&&Math.abs(c.o-px)<.32&&spd>c.s){spd=c.s*.6;shake=.3}}
shake=Math.max(0,shake-dt);time-=dt;score+=spd*dt/10;
if(time<=0){time=0;over=true;earn();if(score>best){best=score;try{localStorage.setItem('bk3',best)}catch(e){}}}
}
// ---------- render 3D ----------
function render3d(t){
if(!started||over){pvUpdate();PV.visible=true;NPC.forEach(c=>c.visible=false);GM.forEach(e=>e.car.visible=false);place(PV,0,0);at(0);const a=t*.0004,P=_p.clone();CAM.position.set(P.x+Math.cos(a)*6.5,P.y+2.2,P.z+Math.sin(a)*6.5);CAM.lookAt(P.x,P.y+.9,P.z);CAM.fov=CAM.baseFov;CAM.updateProjectionMatrix();R.setScissorTest(false);R.setViewport(0,0,W,H);R.render(SC,CAM);return}
if(PV)PV.visible=false;
const sp=spd/MAX,lat=px*6+(LX.w<.5?-.38:.38);
for(const c of cars){let d=((c.z-pos)%TL+TL)%TL;const v=d<320||d>TL-40;c.m.visible=v;if(v)place(c.m,c.z,c.o)}
ghost3d();
at(pos);let cx=_p.x+_r.x*lat,cy=_p.y+1.18,cz=_p.z+_r.z*lat;
const bump=Math.sin(t*.03)*.01*sp+(Math.abs(px)>1.1?(Math.random()-.5)*.08*sp:0)+(shake>0?(Math.random()-.5)*.12:0);
CAM.position.set(cx,cy+bump,cz);
at(pos+30);CAM.lookAt(_p.x+_r.x*(lat+st*4),_p.y+1.0,_p.z+_r.z*(lat+st*4));CAM.rotateZ(-st*sp*.035);
CAM.fov=CAM.baseFov+sp*9;CAM.updateProjectionMatrix();
at(pos);MIR.position.set(_p.x+_r.x*px*6,_p.y+1.3,_p.z+_r.z*px*6);at(pos-40);MIR.lookAt(_p.x+_r.x*px*6,_p.y+1.1,_p.z+_r.z*px*6);
R.setScissorTest(false);R.setViewport(0,0,W,H);R.render(SC,CAM);
R.setScissorTest(true);R.setScissor(mx,H-my-mh,mw,mh);R.setViewport(mx,H-my-mh,mw,mh);R.render(SC,MIR);R.setScissorTest(false);
}
// ---------- HUD kokpit ----------
function gauge(x,y,r,v,txt,lbl,red){let b=g.createLinearGradient(x-r,y-r,x+r,y+r);b.addColorStop(0,'#e4e8ec');b.addColorStop(.5,'#6b7078');b.addColorStop(1,'#d2d6da');
g.fillStyle=b;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.fillStyle='#05070a';g.beginPath();g.arc(x,y,r*.9,0,7);g.fill();
const a0=Math.PI*.75,a1=Math.PI*2.25;g.lineWidth=2;
for(let i=0;i<=10;i++){const a=a0+(a1-a0)*i/10;g.strokeStyle=(red&&i>=9)?'#e33':'#cfd6de';g.beginPath();g.moveTo(x+Math.cos(a)*r*.72,y+Math.sin(a)*r*.72);g.lineTo(x+Math.cos(a)*r*.84,y+Math.sin(a)*r*.84);g.stroke()}
const a=a0+(a1-a0)*Math.min(1,v);g.strokeStyle='#ff3b2f';g.lineWidth=3;g.beginPath();g.moveTo(x-Math.cos(a)*r*.12,y-Math.sin(a)*r*.12);g.lineTo(x+Math.cos(a)*r*.78,y+Math.sin(a)*r*.78);g.stroke();
g.fillStyle='#222';g.beginPath();g.arc(x,y,r*.1,0,7);g.fill();
g.fillStyle='#fff';g.textAlign='center';g.font='bold '+r*.32+'px system-ui';g.fillText(txt,x,y+r*.56);g.font=r*.22+'px system-ui';g.fillStyle='#8fa0b0';g.fillText(lbl,x,y+r*.32)}
function pedal(r,v,lbl){const o=v*6,gr=g.createLinearGradient(r.x,r.y,r.x+r.w,r.y);gr.addColorStop(0,'#2a2d33');gr.addColorStop(.5,'#5a5f68');gr.addColorStop(1,'#2a2d33');
g.fillStyle='#000';g.fillRect(r.x-3,r.y-3,r.w+6,r.h+6);g.fillStyle=gr;g.fillRect(r.x,r.y+o,r.w,r.h-o);g.fillStyle='#0b0c0e';
for(let i=1;i<7;i++)g.fillRect(r.x+6,r.y+o+r.h*i/7,r.w-12,4);g.fillStyle='#d5dae0';g.font='bold 12px system-ui';g.textAlign='center';g.fillText(lbl,r.x+r.w/2,r.y+o+15)}
function wheel(){g.save();g.translate(wx,wy);g.rotate(st*2.356);
g.lineWidth=wr*.17;g.strokeStyle='#151518';g.beginPath();g.arc(0,0,wr,0,7);g.stroke();
g.lineWidth=2;g.strokeStyle='#4b4b55';g.beginPath();g.arc(0,0,wr*1.07,Math.PI*1.05,Math.PI*1.7);g.stroke();
g.setLineDash([4,3]);g.strokeStyle='#8a8a92';g.lineWidth=1;g.beginPath();g.arc(0,0,wr*.92,0,7);g.stroke();g.setLineDash([]);
g.lineWidth=wr*.1;g.strokeStyle='#4a4d55';g.beginPath();g.moveTo(-wr*.92,0);g.lineTo(wr*.92,0);g.moveTo(0,0);g.lineTo(0,wr*.92);g.stroke();
const hb=g.createRadialGradient(-wr*.05,-wr*.05,2,0,0,wr*.3);hb.addColorStop(0,'#8a8e96');hb.addColorStop(1,'#1d1f24');g.fillStyle=hb;g.beginPath();g.arc(0,0,wr*.3,0,7);g.fill();
g.fillStyle='#e22';g.fillRect(-wr*.04,-wr*1.1,wr*.08,wr*.18);g.restore()}
function hud(){
g.clearRect(0,0,W,H);if(!started||over)return;
const pl=g.createLinearGradient(0,0,0,H*.1);pl.addColorStop(0,'rgba(0,0,0,.85)');pl.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=pl;g.fillRect(0,0,W,H*.1);
for(const s of[0,1]){const pg=g.createLinearGradient(s?W:0,0,s?W-W*.09:W*.09,0);pg.addColorStop(0,'rgba(5,6,8,.95)');pg.addColorStop(1,'rgba(5,6,8,0)');g.fillStyle=pg;g.beginPath();g.moveTo(s?W:0,0);g.lineTo(s?W-W*.09:W*.09,0);g.lineTo(s?W:0,Hd);g.fill()}
g.strokeStyle='#0a0a0c';g.lineWidth=5;g.strokeRect(mx-2,my-2,mw+4,mh+4);
const dg=g.createLinearGradient(0,Hd,0,H);dg.addColorStop(0,'#252932');dg.addColorStop(.12,'#14161b');dg.addColorStop(1,'#06070a');
g.fillStyle=dg;g.beginPath();g.moveTo(0,Hd+18);g.quadraticCurveTo(W/2,Hd-14,W,Hd+18);g.lineTo(W,H);g.lineTo(0,H);g.fill();
g.strokeStyle='rgba(180,190,210,.28)';g.lineWidth=2;g.beginPath();g.moveTo(0,Hd+18);g.quadraticCurveTo(W/2,Hd-14,W,Hd+18);g.stroke();
const gr2=Math.min(H*.055,W*.09),gy=Hd+H*.075;
gauge(W*mir(.6),gy,gr2,rpm/7000,(Math.round(rpm/100)/10)+'','x1000',true);gauge(W*mir(.84),gy,gr2,spd/MAX,Math.round(spd*3.6)+'','km/j',false);
g.fillStyle='#e8eef5';g.textAlign='center';g.font='bold '+Math.round(H*.05)+'px system-ui';g.fillText(spd<1?'N':'D'+(gear+1),W*mir(.3),gy+H*.015);g.font='12px system-ui';g.fillStyle='#8fa0b0';g.fillText('GIGI',W*mir(.3),gy-H*.04);
wheel();pedal(brkR,Br,'REM');pedal(gasR,G,'GAS');
const t0=44;g.font='bold 18px system-ui';g.fillStyle='#fff';g.shadowColor='#000';g.shadowBlur=4;
g.textAlign='left';g.fillText('SKOR '+Math.floor(score),14,t0);g.fillStyle=time<10?'#ff6b6b':'#fff';g.fillText('WAKTU '+Math.ceil(time),14,t0+24);
g.fillStyle='#fff';g.textAlign='right';g.fillText('LAP '+lap,W-14,t0);g.font='14px system-ui';g.fillText('REKOR '+Math.floor(best),W-14,t0+22);
if(RM){const L=[{n:'Kamu',d:lap*TL+pos,me:1}].concat(ghosts().map(q=>({n:q.n,d:q.l*TL+q.z}))).sort((a,b)=>b.d-a.d).slice(0,5);
g.font='13px system-ui';g.textAlign='left';L.forEach((r,i)=>{g.fillStyle=r.me?'#7df':'#fff';g.fillText((i+1)+'. '+r.n,14,t0+52+i*17)})}
if(!started||over){g.shadowBlur=0;g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,H*.2,W,H*.2);
g.fillStyle='#fff';g.textAlign='center';g.shadowBlur=4;g.font='bold 26px system-ui';
g.fillText(over?'WAKTU HABIS!':'BALAPAN 3D',W/2,H*.265);
g.font='15px system-ui';g.fillText(over?'Skor '+Math.floor(score)+' · tap untuk main lagi':'Tap untuk mulai',W/2,H*.265+28);
g.fillText('Setir kanan: putar setir, tahan GAS, injak REM',W/2,H*.265+50)}
g.shadowBlur=0;
}
let PV=null,pvk='';
function pvUpdate(){const k=SAVE.veh+'|'+paintC()+'|'+SAVE.spoil[SAVE.veh];if(k===pvk&&PV)return;pvk=k;if(PV)SC.remove(PV);PV=mkCar(new THREE.Color(paintC()),SAVE.veh,SAVE.spoil[SAVE.veh])}
const gar=document.getElementById('gar'),gbody=document.getElementById('gbody'),gmsg=document.getElementById('gmsg');let gtab='veh';
const stat=v=>'Top '+Math.round(v.top*3.6)+' km/j · Akselerasi '+v.acc.toFixed(2)+' · Grip '+v.grip.toFixed(2)+' · Rem '+v.brk.toFixed(2);
function renderGar(){document.getElementById('gc').textContent='💰 '+SAVE.coins;document.body.appendChild(mpEl);mpEl.style.display='none';
document.querySelectorAll('#gtabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===gtab));let h='';
if(gtab==='veh')VEH.forEach((v,i)=>{const own=SAVE.own.includes(i);h+=`<div class='it'><div><b>${v.n}</b><br><small>${stat(v)}</small></div><button data-a='veh' data-i='${i}' ${SAVE.veh===i||(!own&&SAVE.coins<v.p)?'disabled':''}>${SAVE.veh===i?'Dipakai':own?'Pakai':'Beli '+v.p}</button></div>`});
else if(gtab==='mod'){const m=modOf(),v=VEH[SAVE.veh];h+=`<b>${v.n}</b>`;[['e','Mesin','+5% kecepatan, +12% akselerasi'],['t','Ban','+10% grip'],['b','Rem','+12% pengereman']].forEach(([k,nm,ds])=>{const l=m[k],c=200*(l+1);h+=`<div class='it'><div><b>${nm}</b> ${'●'.repeat(l)+'○'.repeat(3-l)}<br><small>${ds}</small></div><button data-a='mod' data-k='${k}' ${l>=3||SAVE.coins<c?'disabled':''}>${l>=3?'MAX':'Upgrade '+c}</button></div>`});
h+=`<div class='it'><div><b>Cat</b><br>${PAINT.map(c=>`<span class='sw' data-a='paint' data-c='${c}' style='background:${c}'></span>`).join('')}</div></div><div class='it'><div><b>Spoiler</b></div><button data-a='spoil'>${SAVE.spoil[SAVE.veh]?'Lepas':'Pasang'}</button></div>`}
else if(gtab==='trk')TRACKS.forEach((t,i)=>{h+=`<div class='it'><div><b>${t.n}</b><br><small>${t.k==='Jalan'?'Balap jalan raya · lalu lintas padat':'Balap sirkuit · lawan mobil balap'}</small></div><button data-a='trk' data-i='${i}' ${SAVE.track===i?'disabled':''}>${SAVE.track===i?'Dipilih':'Pilih'}</button></div>`});
gbody.innerHTML=h;if(gtab==='mp'){mpEl.style.display='flex';gbody.appendChild(mpEl)}}
gbody.onclick=e=>{const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
if(a==='veh'){const i=+el.dataset.i;if(!SAVE.own.includes(i)){SAVE.coins-=VEH[i].p;SAVE.own.push(i)}SAVE.veh=i}
else if(a==='mod'){const m=modOf(),k=el.dataset.k,c=200*(m[k]+1);if(m[k]<3&&SAVE.coins>=c){SAVE.coins-=c;m[k]++}}
else if(a==='paint')SAVE.paint[SAVE.veh]=el.dataset.c;
else if(a==='spoil')SAVE.spoil[SAVE.veh]=SAVE.spoil[SAVE.veh]?0:1;
else if(a==='trk')SAVE.track=+el.dataset.i;
save();renderGar()};
document.getElementById('gtabs').onclick=e=>{const b=e.target.closest('button');if(b){gtab=b.dataset.t;renderGar()}};
document.getElementById('gst').onclick=()=>{snd();applyVeh();if(loaded!==SAVE.track)loadTrack(SAVE.track);init();started=true;over=false;gmsg.textContent=''};
function earn(){const e=Math.floor(score/3)+lap*50;SAVE.coins+=e;save();gmsg.textContent='+'+e+' koin · skor '+Math.floor(score)+' · Suka game ini? Tap ☕ Dukung';renderGar()}
applyVeh();renderGar();
let lt=0;function loop(t){const dt=Math.min(.05,(t-lt)/1000||0);lt=t;upd(dt);render3d(t);hud();pres(t);gar.style.display=(!started||over)?'flex':'none';requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
