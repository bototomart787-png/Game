<script>

function ld(){let s=DEF();try{const x=JSON.parse(localStorage.getItem('bksave'));if(x&&x.own)s=Object.assign(s,x)}catch(e){}s.hu=s.hu||{};s.hu.hw=s.hu.hw||[0];s.hu.ww=s.hu.ww||[0];if(s.admin){s.hu.hw=[0,1,2,3];s.hu.ww=[0,1,2,3]}return s}
function sv(s){try{localStorage.setItem('bksave',JSON.stringify(s))}catch(e){}}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const GR=[['🦌 Senjata berburu','hw',[['Senapan Angin',0],['Senapan Berburu',600],['Semi-Otomatis',1200],['Sniper',2500]]],['🪖 Senjata perang','ww',[['Pistol',0],['SMG',700],['Bazoka',1500],['Senapan Mesin',2500]]]];

+`<h3>Perlengkapan</h3><div class="it"><div><b>Bom perang</b> ${'●'.repeat(L)+'○'.repeat(3-L)}<br><small>+1 bom per level</small></div><button data-b="1" ${L>=3||s.coins<bc?'disabled':''}>${L>=3?'MAX':'Beli '+bc}</button></div>`
